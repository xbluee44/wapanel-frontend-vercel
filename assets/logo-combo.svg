<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0" stop-color="#2CA5E0"/>
      <stop offset="1" stop-color="#0077B6"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" x2="1">
      <stop offset="0" stop-color="#25D366"/>
      <stop offset="1" stop-color="#1DA851"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- background rounded square -->
  <rect width="128" height="128" rx="22" fill="url(#g1)" />

  <!-- WA bubble (left, green) -->
  <g transform="translate(14,22)" filter="url(#soft)">
    <circle cx="30" cy="30" r="30" fill="url(#g3)"/>
    <!-- phone glyph -->
    <path d="M36.2 44.5c-1.2-0.6-3.3-1.7-4.2-2.1-0.8-0.4-1.9-0.3-3.1 0.3-0.3 0.2-0.9 0.5-1.7 0.2-1.6-0.5-4.3-2.6-6.9-5.2-2.6-2.6-4.7-5.4-5.2-7-0.3-0.8 0-1.4 0.2-1.7 0.6-1.1 0.7-2.2 0.3-3.1-0.4-0.9-1.5-3-2.1-4.2-0.6-1.2-1.6-1.8-2.1-2.1-0.6-0.3-1.3-0.3-2-0.1-1.1 0.3-4.1 1.6-6.7 3.9C1.8 23.3 0 28 0 33.3 0 45.8 12.2 58 27.3 58c5.3 0 10-1.8 14.1-4.6 2.3-1.6 3.6-3.6 3.9-4.7 0.2-0.7 0.2-1.4-0.1-2-0.3-0.5-0.9-1.5-2.1-2.1z"
          fill="#ffffff" opacity="0.95" transform="translate(3,1) scale(0.78)"/>
  </g>

  <!-- Telegram plane (top-right, blue) -->
  <g transform="translate(54,8) rotate(-15)" filter="url(#soft)">
    <path d="M46.7 10.2L6.1 46.9c-1.8 1.4-0.4 3.9 1.5 3.6l13.5-2.2 6.8 13.9c0.9 1.9 3.3 1.8 4.1 0.1l7.6-18.5 12.6-29.5c0.8-1.9-1.4-3.3-2.9-2.1z"
          fill="url(#g2)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <path d="M15 48 L45 18" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- NGL mark (center, gradient outline) -->
  <g transform="translate(30,62)">
    <rect x="26" y="-14" width="76" height="44" rx="10" fill="rgba(255,255,255,0.06)"/>
    <text x="64" y="18" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="20" fill="url(#g1)" >
      ngl
    </text>
  </g>
